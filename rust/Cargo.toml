[package]
name = "tempo2-rust"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "TEMPO2 source fixed-parameter timing core with general residuals and bounded fit interfaces"

[dependencies]
rug = { version = "=1.30.0", default-features = false, features = ["float", "integer", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
