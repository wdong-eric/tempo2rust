name: TEMPO2 Rust qualification
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Reviewed full 40-character candidate commit SHA
        required: true
        type: string
      scope:
        description: Full release matrix or partial decision 0117 correction check
        required: true
        default: full
        type: choice
        options:
          - full
          - corrections-0117
permissions:
  contents: read
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      FC: gfortran-13
      NATIVE_CC: gcc-13
      NATIVE_CXX: g++-13
      NATIVE_GCOV: gcov-13
      CC: clang
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      TEMPO2_OPENBLAS: '1'
      REVIEWED_CANDIDATE: ${{ inputs.candidate }}
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify identity and provision recorded tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_CANDIDATE"
          # Native TKlog caps the full line before pathname projection. Keep
          # fixture/build paths short enough to compare complete message bodies.
          mkdir -p /tmp/t2/host
          baseline=$(PYTHONPATH=validation/release python3 -c 'from source_audit import BASELINE; print(BASELINE)')
          git fetch --no-tags --depth=1 origin "$baseline" > /tmp/t2/host/baseline-fetch.stdout 2> /tmp/t2/host/baseline-fetch.stderr
          uname -a > /tmp/t2/host/uname.txt
          cp /etc/os-release /tmp/t2/host/os-release.txt
          printf '%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH" > /tmp/t2/host/runner.txt
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 gfortran-13 clang cmake python3 libopenblas-pthread-dev liblapacke-dev locales
          sudo locale-gen de_DE.UTF-8 fr_FR.UTF-8
          dpkg-query -W > /tmp/t2/host/packages.txt
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc -Vv > /tmp/t2/host/rust.txt
          cargo -V > /tmp/t2/host/cargo.txt
      - name: Fetch frozen allocation and predictor comparison sources
        if: inputs.scope != 'corrections-0117'
        shell: bash
        run: |
          # Keep each failure as evidence; the matrix checks both objects and
          # blocks only their dependent comparison stages if unavailable.
          while read -r group label revision; do
            if git fetch --no-auto-maintenance --no-tags --depth=1 origin "$revision:refs/al-$group/$label" > "/tmp/t2/host/$group-$label-fetch.stdout" 2> "/tmp/t2/host/$group-$label-fetch.stderr"; then
              fetch_status=0
            else
              fetch_status=$?
            fi
            printf '%s\n' "$fetch_status" > "/tmp/t2/host/$group-$label-fetch-status.txt"
          done < <(PYTHONPATH=validation/release python3 -c 'from integrated import ALLOCATION_REVISIONS, PREDICTOR_REVISIONS, EVALUATOR_REVISIONS, RECURRENCE_REVISIONS; print("\n".join(group+" "+k+" "+v for group, pair in [("allocation", ALLOCATION_REVISIONS), ("predictor-performance", PREDICTOR_REVISIONS), ("evaluator-performance", EVALUATOR_REVISIONS), ("recurrence-performance", RECURRENCE_REVISIONS)] for k,v in pair.items()))')
      - name: Execute clean native and installed candidate matrix
        if: inputs.scope != 'corrections-0117'
        run: python3 validation/release/integrated.py --out /tmp/t2/linux --revision "$REVIEWED_CANDIDATE"
      - name: Execute partial 0117 correction qualification
        if: inputs.scope == 'corrections-0117'
        run: python3 validation/release/focused_0117.py --out /tmp/t2/linux --revision "$REVIEWED_CANDIDATE"
      - name: Collect evidence including failures
        if: always()
        run: python3 validation/release/collect_evidence.py --input /tmp/t2 --out validation/release/evidence
      - name: Retain selected evidence for 30 days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tempo2-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/release/evidence
          retention-days: 30
          if-no-files-found: error
